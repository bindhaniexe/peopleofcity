name: Bug report
description: Something in the city doesn't work as it should
labels: [bug]
body:
  - type: textarea
    attributes: { label: What happened, description: "What you did, what you expected, what you saw instead." }
    validations: { required: true }
  - type: textarea
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    attributes: { label: Device and browser, placeholder: "e.g. iPhone 15, Safari 18 / MacBook, Chrome 131" }
  - type: textarea
    attributes: { label: Screenshots or console errors }
